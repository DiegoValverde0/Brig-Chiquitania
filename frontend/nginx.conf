# Sirve la app web (PWA) y pasa /api al backend. Un solo origen: sin CORS y el service worker controla todo.
# HTTPS: la geolocalización del navegador exige contexto seguro; en el VPS, terminar TLS delante de este
# contenedor (p. ej. certificado de Let's Encrypt) o montar el certificado aquí.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

  # Fotos ≤100 KB (RF-03) y reportes <2 KB: nada más grande debería llegar a la API.
  client_max_body_size 110k;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # El service worker y el HTML se revalidan siempre para que las actualizaciones lleguen a los teléfonos.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=3600" always;
  }
}
