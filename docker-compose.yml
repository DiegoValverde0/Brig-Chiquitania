# Orquestación del MVP para el VPS: PostgreSQL + API + app web (nginx).
# Límites de memoria pensados para un host de 1 GB de RAM.
#
# Desarrollo local: `docker compose up -d --build` funciona sin configurar nada (NODE_ENV=development,
# claves de ejemplo, usuarios demo con la semilla).
# VPS: crear un archivo .env junto a este archivo con NODE_ENV=production, CLAVE_CIFRADO (32 bytes base64:
# `openssl rand -base64 32`), SMS_WEBHOOK_SECRETO, DB_PASSWORD y DB_SYNCHRONIZE=false cuando haya migraciones.
services:
  db:
    image: postgres:16-alpine
    container_name: chiquitania_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chiquitania}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chiquitania_dev}
      POSTGRES_DB: ${DB_NAME:-chiquitania_db}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
      -c work_mem=4MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  api:
    build:
      context: ./backend
    container_name: chiquitania_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-chiquitania}
      DB_PASSWORD: ${DB_PASSWORD:-chiquitania_dev}
      DB_NAME: ${DB_NAME:-chiquitania_db}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      # RNF-08: clave AES-256 (obligatoria con NODE_ENV=production). Si se pierde, los datos cifrados no se recuperan.
      CLAVE_CIFRADO: ${CLAVE_CIFRADO:-}
      EVIDENCIAS_DIR: /app/almacen/evidencias
      # HU-1.3: pasarela SMS (hoy "simulado"), secreto del webhook del proveedor y número de la central.
      SMS_PROVEEDOR: ${SMS_PROVEEDOR:-simulado}
      SMS_WEBHOOK_SECRETO: ${SMS_WEBHOOK_SECRETO:-}
      SMS_NUMERO_CENTRAL: ${SMS_NUMERO_CENTRAL:-+59170000000}
    volumes:
      - evidencias:/app/almacen
    ports:
      - "3000:3000"
    mem_limit: 320m

  web:
    image: nginx:1.27-alpine
    container_name: chiquitania_web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./frontend/app:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    mem_limit: 32m

volumes:
  pgdata:
  evidencias:
